services:
  - type: web
    name: garmin-coach
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir src api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TOEGANGSCODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GARMIN_TOKEN_JSON
        sync: false
